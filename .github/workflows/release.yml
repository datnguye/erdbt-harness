name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.2.0"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version from the published release
        id: version
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          version="${tag##*v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' is not a semver version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Stamp the crate version from the tag
        run: |
          sed -i '0,/^version = ".*"$/s//version = "${{ steps.version.outputs.version }}"/' \
            src/erdbt-core/Cargo.toml
          grep -m1 '^version = ' src/erdbt-core/Cargo.toml

      - name: Test
        run: cargo test --release

      - name: Publish the crate
        run: cargo publish -p erdbt-core --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
