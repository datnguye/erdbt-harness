[package]
name = "erdbt-core"
version = "0.0.0"
edition = "2021"
description = "Render authored erdbt sources into the Claude Code and GitHub Copilot CLI plugin trees."
license = "MIT"
repository = "https://github.com/datnguye/erdbt-harness"
homepage = "https://github.com/datnguye/erdbt-harness"
readme = "README.md"
keywords = ["dbt", "erd", "data-modeling", "claude-code", "plugin"]
categories = ["command-line-utilities", "development-tools"]
include = ["main.rs", "render/**/*.rs", "Cargo.toml", "README.md"]

[lib]
name = "erdbt_core"
path = "render/lib.rs"

[[bin]]
name = "erdbt"
path = "main.rs"

[[test]]
name = "frontmatter"
path = "../../tests/erdbt-core/unit/input/frontmatter.rs"

[[test]]
name = "sources"
path = "../../tests/erdbt-core/unit/input/sources.rs"

[[test]]
name = "registry"
path = "../../tests/erdbt-core/unit/formats/registry.rs"

[[test]]
name = "claude"
path = "../../tests/erdbt-core/unit/formats/claude.rs"

[[test]]
name = "copilot"
path = "../../tests/erdbt-core/unit/formats/copilot.rs"

[[test]]
name = "tree"
path = "../../tests/erdbt-core/unit/output/tree.rs"

[[test]]
name = "bump"
path = "../../tests/erdbt-core/unit/output/bump.rs"

[[test]]
name = "cli"
path = "../../tests/erdbt-core/integration/cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
